<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>千人宴｜教定區調查</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#c9a84c;--gold-light:#f5edd6;
  --red:#8b1a1a;--red-light:#f9eeee;
  --green:#1a5c3a;--green-light:#eaf6f0;
  --blue:#1a3a6b;--blue-light:#eaf0fb;
  --ink:#1a1410;--paper:#fdfaf5;--paper2:#f5ede0;
  --border:#ddd0bb;
}
body{font-family:'Noto Sans TC',system-ui,sans-serif;font-size:13px;color:var(--ink);background:var(--paper);min-height:100vh}
.app{max-width:780px;margin:0 auto;padding:16px}

/* header */
.header{text-align:center;padding:18px 0 14px;border-bottom:2px solid var(--gold);margin-bottom:18px}
.header h1{font-size:22px;font-weight:700;color:var(--red);letter-spacing:4px}
.header p{font-size:12px;color:#999;margin-top:4px;letter-spacing:2px}

/* tabs */
.tabs{display:flex;gap:2px;margin-bottom:16px;border-bottom:1px solid var(--border)}
.tab{padding:8px 16px;font-size:13px;cursor:pointer;border:none;background:none;color:#888;border-bottom:2px solid transparent;margin-bottom:-1px;font-family:inherit}
.tab.on{color:var(--red);border-bottom-color:var(--red);font-weight:500}

.sec{display:none}.sec.on{display:block}

/* summary */
.sbar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.sc{background:var(--paper2);border-radius:8px;padding:10px 12px}
.sc .n{font-size:20px;font-weight:700}
.sc .l{font-size:11px;color:#888;margin-top:2px}
.sc.red{background:var(--red-light)}.sc.red .n{color:var(--red)}
.sc.grn{background:var(--green-light)}.sc.grn .n{color:var(--green)}
.sc.blu{background:var(--blue-light)}.sc.blu .n{color:var(--blue)}

/* legend */
.legend{display:flex;gap:14px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.leg{display:flex;align-items:center;gap:5px;font-size:12px;color:#666}
.dot{width:13px;height:13px;border-radius:50%;flex-shrink:0}
.dot.attend{background:#1a5c3a}.dot.donate{background:#1a3a6b}
.dot.empty{background:#e8ddd0;border:1.5px dashed #bbb}

/* group chips */
.gsel{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.gchip{padding:5px 13px;border-radius:20px;border:1px solid var(--border);background:var(--paper2);font-size:12px;cursor:pointer;color:#666;font-family:inherit}
.gchip.on{background:var(--red-light);border-color:var(--red);color:var(--red);font-weight:500}

/* table grid */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}

/* round table card */
.rt-card{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color .15s}
.rt-card:hover{border-color:var(--gold)}
.rt-card.sel{border:2px solid var(--gold)}
.rt-top{padding:10px 12px 6px}
.rt-title{font-size:12px;font-weight:600;text-align:center;margin-bottom:3px}
.rt-sub{font-size:11px;text-align:center;color:#888;margin-bottom:6px}
.rt-stats{display:flex;justify-content:center;gap:10px;font-size:11px;margin-top:4px;padding-bottom:8px}

/* donate strip (legacy, kept for backward compat) */
.donate-strip{border-top:1px solid var(--border);background:var(--blue-light);padding:7px 10px}
.ds-title{font-size:10px;color:var(--blue);margin-bottom:5px;font-weight:600}
.dpills{display:flex;flex-wrap:wrap;gap:4px}
.dpill{font-size:11px;background:#fff;border:1px solid #a0b4d6;color:var(--blue);border-radius:20px;padding:2px 9px;cursor:pointer;transition:background .1s}
.dpill:hover{background:#dce8f8}

/* dedicated donate panel (pulled out, separate from tables) */
.dpanel{background:#fff;border:1px solid #a0b4d6;border-radius:12px;margin-top:18px;overflow:hidden}
.dpanel-head{background:var(--blue-light);padding:10px 14px;border-bottom:1px solid #c4d0e6;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}
.dpanel-head h3{font-size:14px;font-weight:600;color:var(--blue)}
.dpanel-head .subt{font-size:11px;color:#666;margin-top:2px}
.dpanel-head .total{font-size:12px;color:var(--blue);background:#fff;border:1px solid #a0b4d6;border-radius:14px;padding:2px 10px;font-weight:500}
.dpanel-body{padding:6px 14px}
.dgrp{padding:9px 0;border-bottom:1px dashed #d8e0ee}
.dgrp:last-child{border-bottom:none}
.dgrp-title{font-size:12px;font-weight:600;color:var(--ink);margin-bottom:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dgrp-title .owner{font-size:11px;color:#888;font-weight:400}
.dgrp-title .count{font-size:11px;color:var(--blue);background:var(--blue-light);border-radius:12px;padding:1px 8px;font-weight:500}
.dgrp-pills{display:flex;flex-wrap:wrap;gap:4px}

/* detail panel */
.detail{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;margin-top:14px}
.detail h3{font-size:14px;font-weight:600;margin-bottom:10px}
.slist{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px}
.si{display:flex;align-items:center;gap:7px;padding:6px 9px;border-radius:7px;border:1px solid var(--border);font-size:12px;cursor:pointer;background:var(--paper2);transition:border-color .1s}
.si:hover{border-color:var(--gold)}
.sdot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.sdot.attend{background:#1a5c3a}.sdot.donate{background:#1a3a6b}
.sdot.empty{background:#e8ddd0;border:1.5px dashed #aaa}
.sname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sstatus{font-size:10px;color:#999}
.donate-section{margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.donate-section h4{font-size:12px;font-weight:600;color:var(--blue);margin-bottom:6px}

/* buttons */
.btn{border:1px solid #ccc;background:var(--paper2);color:var(--ink);padding:5px 11px;border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit;transition:background .1s}
.btn:hover{background:var(--gold-light);border-color:var(--gold)}
.btn.pri{background:var(--red);color:#fff;border-color:var(--red)}.btn.pri:hover{background:#6d1515}
.btn.sm{padding:3px 8px;font-size:11px}
.btn.blu{color:var(--blue);border-color:#a0b4d6}.btn.blu:hover{background:var(--blue-light)}
.btn.danger{color:var(--red);border-color:#e0b0b0}.btn.danger:hover{background:var(--red-light)}

/* form */
.fg{display:flex;flex-direction:column;gap:3px;margin-bottom:10px}
.fg label{font-size:11px;color:#888}
.fg input,.fg select{border:1px solid #ccc;background:#fff;padding:7px 10px;border-radius:6px;font-size:13px;font-family:inherit;color:var(--ink);outline:none;width:100%}
.fg input:focus,.fg select:focus{border-color:var(--gold)}
.fg input[type=date]{width:200px}

/* modal */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;align-items:center;justify-content:center}
.overlay.open{display:flex}
.modal{background:#fff;border:1px solid var(--border);border-radius:14px;padding:20px;width:320px;max-width:92vw;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.modal h3{font-size:15px;font-weight:600;margin-bottom:14px;color:var(--red)}
.mbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}

/* mgmt */
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.topbar h3{font-size:14px;font-weight:600}
.grp-block{background:#fff;border:1px solid var(--border);border-radius:10px;margin-bottom:12px;overflow:hidden}
.grp-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--paper2);border-bottom:1px solid var(--border)}
.grp-row{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-top:1px solid var(--border);font-size:12px}

/* cfg */
.cfg-wrap{max-width:420px}
.cfg-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}

@media(max-width:480px){
  .sbar{grid-template-columns:repeat(2,1fr)}
  .tgrid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>千人宴｜教定區調查</h1>
    <p>席位管理系統</p>
  </div>

  <div class="tabs">
    <button class="tab on" onclick="sw('vis')">圓桌視圖</button>
    <button class="tab" onclick="sw('mgmt')">名單管理</button>
  </div>

  <!-- 圓桌視圖 -->
  <div class="sec on" id="s-vis">
    <div class="sbar" id="sbar"></div>
    <div class="legend">
      <div class="leg"><div class="dot attend"></div>人到 +1500</div>
      <div class="leg"><div class="dot donate"></div>佈施 +1500（不佔位）</div>
      <div class="leg"><div class="dot empty"></div>空位待補</div>
    </div>
    <div class="gsel" id="gsel"></div>
    <div class="tgrid" id="tgrid"></div>
    <div class="detail" id="detail" style="display:none"></div>
    <div id="dpanel"></div>
  </div>

  <!-- 名單管理 -->
  <div class="sec" id="s-mgmt">
    <div class="topbar">
      <h3>分組 &amp; 名單管理</h3>
      <button class="btn" onclick="openAddGroup()">+ 新增分組</button>
    </div>
    <div id="mgmt-list"></div>
  </div>

  <!-- 設定 -->
  <div class="sec" id="s-cfg">
    <div class="cfg-wrap">
      <div class="fg"><label>活動名稱</label><input id="cfg-name"></div>
      <div class="fg"><label>活動日期</label><input id="cfg-date" type="date"></div>
      <div class="fg"><label>備註說明</label><input id="cfg-note"></div>
      <div class="cfg-actions">
        <button class="btn pri" onclick="saveCfg()">儲存設定</button>
        <button class="btn danger" onclick="resetAll()">清除全部資料</button>
      </div>
    </div>
  </div>
</div>

<!-- 座位編輯 modal -->
<div class="overlay" id="modal">
  <div class="modal">
    <h3 id="m-title">編輯座位</h3>
    <div class="fg"><label>姓名</label><input id="m-name" placeholder="空白表示空位"></div>
    <div class="fg"><label>狀態</label>
      <select id="m-status">
        <option value="attend">人到 +1500</option>
        <option value="donate">佈施 +1500（不佔位）</option>
        <option value="empty">空位（待補）</option>
      </select>
    </div>
    <div class="fg"><label>備註</label><input id="m-note" placeholder="選填"></div>
    <div class="mbtns">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn pri" onclick="saveModal()">儲存</button>
    </div>
  </div>
</div>

<!-- 新增分組 modal -->
<div class="overlay" id="modal-grp">
  <div class="modal">
    <h3>新增分組</h3>
    <div class="fg"><label>分組名稱</label><input id="mg-name" placeholder="例：茶道"></div>
    <div class="fg"><label>負責壇主</label><input id="mg-owner" placeholder="壇主姓名"></div>
    <div class="fg"><label>桌數</label><input id="mg-tables" type="number" min="1" max="20" value="1" style="width:80px"></div>
    <div class="mbtns">
      <button class="btn" onclick="document.getElementById('modal-grp').classList.remove('open')">取消</button>
      <button class="btn pri" onclick="saveGroupModal()">建立</button>
    </div>
  </div>
</div>

<script>
const SK='qianren_rt_v7';
let D=load(), selGroup=null, selSeat=null, lastTid=null;

function load(){
  try{
    const r=localStorage.getItem(SK);
    if(r){
      const d=JSON.parse(r);
      // 遷移：移除教定區壇主名稱
      const g1=d.groups.find(g=>g.id==='g1');
      if(g1&&g1.owner==='謝壇主')g1.owner='';
      // 遷移：若無素環壇主分組則自動補入
      if(!d.groups.find(g=>g.id==='g3')){
        d.groups.splice(1,0,{id:'g3',name:'素環',owner:'素環壇主',tables:[
          {id:'t5',label:'佈施名單',seats:Array.from({length:8},(_,i)=>({id:'su'+(i+1),name:'道親',status:'donate',note:'無法出席，以佈施方式呈現'}))},
          {id:'t6',label:'第三桌',seats:Array.from({length:10},(_,i)=>({id:'sv'+(i+1),name:'',status:'empty',note:''}))}
        ]});
        try{localStorage.setItem(SK,JSON.stringify(d));}catch(e){}
      }
      // 遷移：刪除素環的佈施名單桌
      if(g3)g3.tables=g3.tables.filter(t=>t.id!=='t5');
      // 遷移：若素環已存在但缺第三桌則補入
      const g3=d.groups.find(g=>g.id==='g3');
      if(g3&&!g3.tables.find(t=>t.id==='t6')){
        g3.tables.push({id:'t6',label:'第三桌',seats:Array.from({length:8},(_,i)=>({id:'sv'+(i+1),name:'',status:'empty',note:''}))});
        try{localStorage.setItem(SK,JSON.stringify(d));}catch(e){}
      }
      // 遷移：第三桌若超過8位則裁切至8位
      const t6=g3&&g3.tables.find(t=>t.id==='t6');
      if(t6&&t6.seats.length>8){t6.seats=t6.seats.slice(0,8);try{localStorage.setItem(SK,JSON.stringify(d));}catch(e){}}
      return d;
    }
  }catch(e){}
  return def();
}

function def(){
  return {
    cfg:{name:'千人宴｜教定區',date:'',note:'呼籲各壇主廣邀道親前賢補位'},
    groups:[
      {id:'g1',name:'教定區',owner:'',tables:[
        {id:'t1',label:'第一桌',seats:[
          {id:'a1',name:'道親',status:'attend',note:''},
          {id:'a2',name:'道親',status:'attend',note:''},
          {id:'a3',name:'道親',status:'attend',note:''},
          {id:'a4',name:'道親',status:'attend',note:''},
          {id:'a5',name:'道親',status:'attend',note:''},
          {id:'a6',name:'道親',status:'attend',note:''},
          {id:'a7',name:'道親',status:'attend',note:''},
          {id:'a8',name:'道親',status:'attend',note:''},
          {id:'a9',name:'道親',status:'attend',note:''},
          {id:'a10',name:'道親',status:'attend',note:''},
        ]},
        {id:'t2',label:'第二桌',seats:[
          {id:'b1',name:'范植勇',status:'attend',note:''},
          {id:'b2',name:'劉治中',status:'attend',note:''},
          {id:'b3',name:'歐燕慧',status:'attend',note:''},
          {id:'b4',name:'曾安誠',status:'attend',note:''},
          {id:'b5',name:'姜詠崴',status:'attend',note:''},
          {id:'b6',name:'張德光',status:'attend',note:''},
          {id:'b7',name:'李冠德',status:'attend',note:''},
          {id:'b8',name:'',status:'empty',note:''},
          {id:'b9',name:'',status:'empty',note:''},
          {id:'b10',name:'',status:'empty',note:''},
          {id:'b11',name:'彭永才',status:'donate',note:'佈施但無法出席'},
          {id:'b12',name:'曾玉錦',status:'donate',note:'佈施但無法出席'},
        ]},
      ]},
      {id:'g3',name:'素環',owner:'素環壇主',tables:[
        {id:'t6',label:'第三桌',seats:Array.from({length:8},(_,i)=>({id:'sv'+(i+1),name:'',status:'empty',note:''}))},
      ]},
      {id:'g2',name:'茶道',owner:'錦秀壇主',tables:[
        {id:'t3',label:'第一桌',seats:Array.from({length:10},(_,i)=>({id:'c'+(i+1),name:'道親',status:'attend',note:''}))},
        {id:'t4',label:'第二桌',seats:[
          {id:'d1',name:'道親',status:'attend',note:''},
          ...Array.from({length:9},(_,i)=>({id:'d'+(i+2),name:'',status:'empty',note:'有繳費但缺席'})),
        ]},
      ]},
    ]
  };
}

function sv(){try{localStorage.setItem(SK,JSON.stringify(D));}catch(e){}render();}
function uid(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function allSeats(){return D.groups.flatMap(g=>g.tables.flatMap(t=>t.seats));}
function stats(seats){return{
  attend:seats.filter(s=>s.status==='attend').length,
  donate:seats.filter(s=>s.status==='donate').length,
  empty:seats.filter(s=>s.status==='empty').length
};}

function sw(t){
  document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('on',['vis','mgmt','cfg'][i]===t));
  ['s-vis','s-mgmt','s-cfg'].forEach(id=>document.getElementById(id).classList.toggle('on',id==='s-'+t));
}

function render(){renderSbar();renderGsel();renderTgrid();renderDonatePanel();renderMgmt();renderCfg();}

function renderSbar(){
  const s=stats(allSeats());
  document.getElementById('sbar').innerHTML=`
    <div class="sc grn"><div class="n">${s.attend}</div><div class="l">人到 +1500</div></div>
    <div class="sc blu"><div class="n">${s.donate}</div><div class="l">佈施 +1500</div></div>
    <div class="sc red"><div class="n">${s.empty}</div><div class="l">空位待補</div></div>
    <div class="sc"><div class="n">${s.attend+s.empty}</div><div class="l">實際席位數</div></div>`;
}

function renderGsel(){
  document.getElementById('gsel').innerHTML=
    `<button class="gchip${selGroup===null?' on':''}" onclick="selGrp(null)">全部</button>`+
    D.groups.map(g=>`<button class="gchip${selGroup===g.id?' on':''}" onclick="selGrp('${g.id}')">${g.name}</button>`).join('');
}
function selGrp(id){selGroup=id;selSeat=null;lastTid=null;document.getElementById('detail').style.display='none';render();}

function renderTgrid(){
  const groups=selGroup?D.groups.filter(g=>g.id===selGroup):D.groups;
  const tables=groups.flatMap(g=>g.tables.map(t=>({...t,gname:g.name,owner:g.owner,gid:g.id})));
  document.getElementById('tgrid').innerHTML=tables.map(t=>{
    const seatSeats=t.seats.filter(s=>s.status!=='donate');
    const s=stats(t.seats);
    const n=seatSeats.length;
    const sz=190,cx=sz/2,cy=sz/2,tr=56,sr=15;
    const seatsSvg=seatSeats.map((seat,i)=>{
      const a=(2*Math.PI/Math.max(n,1))*i-Math.PI/2;
      const x=(cx+tr*Math.cos(a)).toFixed(1);
      const y=(cy+tr*Math.sin(a)).toFixed(1);
      const yt=(parseFloat(y)+4).toFixed(1);
      const col=seat.status==='attend'?'#1a5c3a':'#e8ddd0';
      const stk=seat.status==='empty'?'#bbb':col;
      const dash=seat.status==='empty'?'stroke-dasharray="3 2"':'';
      const nm=seat.name?(seat.name.length>2?seat.name.slice(-2):seat.name):'';
      const tc=seat.status==='attend'?'#fff':'#aaa';
      return `<circle cx="${x}" cy="${y}" r="${sr}" fill="${col}" stroke="${stk}" stroke-width="1.5" ${dash} style="cursor:pointer" onclick="openSeat('${t.id}','${seat.id}')"/>
<text x="${x}" y="${yt}" text-anchor="middle" font-size="9" fill="${tc}" font-family="sans-serif" style="pointer-events:none;user-select:none">${nm}</text>`;
    }).join('');
    const isSel=selSeat&&selSeat.tid===t.id;
    const cLabel=s.empty>0?s.empty+'空位':'滿座';
    return `<div class="rt-card${isSel?' sel':''}" onclick="selectTable('${t.id}')">
  <div class="rt-top">
    <div class="rt-title">${t.label}</div>
    <div class="rt-sub">${t.gname} · ${t.owner}</div>
    <svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}" style="display:block;margin:0 auto">
      <circle cx="${cx}" cy="${cy}" r="28" fill="#fdf8f0" stroke="#d4b896" stroke-width="1.5"/>
      <text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="11" fill="#8a6d28" font-family="sans-serif">${s.attend}/${n}</text>
      <text x="${cx}" y="${cy+10}" text-anchor="middle" font-size="9" fill="#c9a84c" font-family="sans-serif">${cLabel}</text>
      ${seatsSvg}
    </svg>
    <div class="rt-stats">
      <span style="color:#1a5c3a">到 ${s.attend}</span>
      ${s.empty?`<span style="color:#8b1a1a">空 ${s.empty}</span>`:''}
    </div>
  </div>
</div>`;
  }).join('');
}

function renderDonatePanel(){
  // Collect all donate seats across all groups (respect group filter if selected)
  const UNIT=1500;
  const groups=selGroup?D.groups.filter(g=>g.id===selGroup):D.groups;
  const groupData=groups.map(g=>{
    const items=g.tables.flatMap(t=>t.seats.filter(s=>s.status==='donate').map(s=>({...s,tid:t.id,tlabel:t.label})));
    return {gid:g.id,gname:g.name,owner:g.owner,items};
  }).filter(g=>g.items.length>0);
  const total=groupData.reduce((a,g)=>a+g.items.length,0);
  const totalAmt=total*UNIT;
  const el=document.getElementById('dpanel');
  if(total===0){el.innerHTML='';return;}
  const fmt=n=>n.toLocaleString('zh-TW');
  el.innerHTML=`<div class="dpanel">
    <div class="dpanel-head">
      <div>
        <h3>佈施名單（人不到，不佔位）</h3>
        <div class="subt">每位 +${fmt(UNIT)} · 已從各圓桌中拉出獨立表列</div>
      </div>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        <span class="total">共 ${total} 位</span>
        <span class="total" style="background:var(--blue);color:#fff;border-color:var(--blue)">合計 NT$ ${fmt(totalAmt)}</span>
      </div>
    </div>
    <div class="dpanel-body">
      ${groupData.map(g=>`
        <div class="dgrp">
          <div class="dgrp-title">
            <span>${g.gname}</span>
            <span class="owner">· ${g.owner}</span>
            <span class="count">${g.items.length} 位 · NT$ ${fmt(g.items.length*UNIT)}</span>
          </div>
          <div class="dgrp-pills">
            ${g.items.map(it=>`<span class="dpill" title="${it.tlabel}${it.note?' · '+it.note:''}" onclick="openSeat('${it.tid}','${it.id}')">${it.name||'未命名'}</span>`).join('')}
          </div>
        </div>`).join('')}
    </div>
  </div>`;
}

function selectTable(tid,silent){
  lastTid=tid;
  const allT=D.groups.flatMap(g=>g.tables.map(t=>({...t,gname:g.name,owner:g.owner,gid:g.id})));
  const tbl=allT.find(t=>t.id===tid);
  if(!tbl)return;
  selSeat={tid};
  if(!silent)renderTgrid();
  const el=document.getElementById('detail');
  el.style.display='block';
  const seatSeats=tbl.seats.filter(s=>s.status!=='donate');
  const donateSeats=tbl.seats.filter(s=>s.status==='donate');
  el.innerHTML=`<h3>${tbl.label} <span style="font-size:12px;color:#888;font-weight:400">· ${tbl.gname} · ${tbl.owner}</span></h3>
<div class="slist">
${seatSeats.map((s,i)=>`<div class="si" onclick="openSeat('${tid}','${s.id}')">
  <div class="sdot ${s.status}"></div>
  <span class="sname">${s.name||('座位'+(i+1))}</span>
  <span class="sstatus">${s.status==='attend'?'出席':'空位'}</span>
</div>`).join('')}
</div>
${donateSeats.length>0?`<div class="donate-section">
  <h4>佈施 +1500（不佔位）共 ${donateSeats.length} 位</h4>
  <div class="slist">${donateSeats.map(s=>`<div class="si" onclick="openSeat('${tid}','${s.id}')">
    <div class="sdot donate"></div>
    <span class="sname">${s.name||'未命名'}</span>
    <span class="sstatus">佈施</span>
  </div>`).join('')}</div>
</div>`:''}
<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
  <button class="btn sm" onclick="addSeatTo('${tid}','attend')">+ 新增座位</button>
  <button class="btn sm blu" onclick="addSeatTo('${tid}','donate')">+ 新增佈施</button>
  <button class="btn sm danger" onclick="deleteTable('${tbl.gid}','${tid}')">刪除此桌</button>
</div>`;
  el.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function openSeat(tid,sid){
  const tbl=D.groups.flatMap(g=>g.tables).find(t=>t.id===tid);
  const seat=tbl.seats.find(s=>s.id===sid);
  selSeat={tid,sid};
  document.getElementById('m-title').textContent='編輯';
  document.getElementById('m-name').value=seat.name||'';
  document.getElementById('m-status').value=seat.status;
  document.getElementById('m-note').value=seat.note||'';
  document.getElementById('modal').classList.add('open');
}
function addSeatTo(tid,def){
  selSeat={tid,sid:null};
  document.getElementById('m-title').textContent='新增';
  document.getElementById('m-name').value='';
  document.getElementById('m-status').value=def||'empty';
  document.getElementById('m-note').value='';
  document.getElementById('modal').classList.add('open');
}
function closeModal(){document.getElementById('modal').classList.remove('open');}
function saveModal(){
  const name=document.getElementById('m-name').value.trim();
  const status=document.getElementById('m-status').value;
  const note=document.getElementById('m-note').value.trim();
  const tbl=D.groups.flatMap(g=>g.tables).find(t=>t.id===selSeat.tid);
  if(selSeat.sid){
    const s=tbl.seats.find(s=>s.id===selSeat.sid);
    s.name=name;s.status=status;s.note=note;
  } else {
    tbl.seats.push({id:uid(),name,status,note});
  }
  closeModal();sv();
  if(lastTid)selectTable(lastTid,true);
}
function deleteTable(gid,tid){
  if(!confirm('確定刪除此桌？'))return;
  D.groups.find(g=>g.id===gid).tables=D.groups.find(g=>g.id===gid).tables.filter(t=>t.id!==tid);
  lastTid=null;document.getElementById('detail').style.display='none';selSeat=null;sv();
}

function renderMgmt(){
  document.getElementById('mgmt-list').innerHTML=D.groups.map(g=>`
<div class="grp-block">
  <div class="grp-head">
    <span style="font-weight:600">${g.name} <span style="font-size:11px;color:#888;font-weight:400">· ${g.owner}</span></span>
    <div style="display:flex;gap:6px">
      <button class="btn sm" onclick="addTableTo('${g.id}')">+ 加桌</button>
      <button class="btn sm danger" onclick="deleteGroup('${g.id}')">刪除分組</button>
    </div>
  </div>
  ${g.tables.map(t=>{const s=stats(t.seats);const ns=t.seats.filter(x=>x.status!=='donate').length;return`
  <div class="grp-row">
    <span style="font-weight:500">${t.label}</span>
    <span style="color:#888">出席 ${s.attend}/${ns} · 空位 ${s.empty} · 佈施 ${s.donate}</span>
    <button class="btn sm" onclick="sw('vis');selGrp('${g.id}');selectTable('${t.id}')">管理座位</button>
  </div>`;}).join('')}
</div>`).join('');
}

function openAddGroup(){
  document.getElementById('mg-name').value='';
  document.getElementById('mg-owner').value='';
  document.getElementById('mg-tables').value='1';
  document.getElementById('modal-grp').classList.add('open');
}
function saveGroupModal(){
  const name=document.getElementById('mg-name').value.trim();
  const owner=document.getElementById('mg-owner').value.trim();
  const nt=parseInt(document.getElementById('mg-tables').value)||1;
  if(!name)return alert('請輸入分組名稱');
  const labels=['一','二','三','四','五','六','七','八','九','十'];
  D.groups.push({id:uid(),name,owner,tables:Array.from({length:nt},(_,ti)=>({
    id:uid(),label:`第${labels[ti]||ti+1}桌`,
    seats:Array.from({length:10},()=>({id:uid(),name:'',status:'empty',note:''}))
  }))});
  document.getElementById('modal-grp').classList.remove('open');sv();
}
function addTableTo(gid){
  const g=D.groups.find(g=>g.id===gid);
  const labels=['一','二','三','四','五','六','七','八','九','十'];
  g.tables.push({id:uid(),label:`第${labels[g.tables.length]||g.tables.length+1}桌`,
    seats:Array.from({length:10},()=>({id:uid(),name:'',status:'empty',note:''}))});
  sv();
}
function deleteGroup(gid){
  if(!confirm('確定刪除此分組？'))return;
  D.groups=D.groups.filter(g=>g.id!==gid);
  if(selGroup===gid)selGroup=null;sv();
}

function renderCfg(){
  document.getElementById('cfg-name').value=D.cfg.name||'';
  document.getElementById('cfg-date').value=D.cfg.date||'';
  document.getElementById('cfg-note').value=D.cfg.note||'';
}
function saveCfg(){
  D.cfg.name=document.getElementById('cfg-name').value;
  D.cfg.date=document.getElementById('cfg-date').value;
  D.cfg.note=document.getElementById('cfg-note').value;
  sv();alert('已儲存！');
}
function resetAll(){
  if(!confirm('確定清除全部資料？此動作無法復原。'))return;
  D=def();lastTid=null;
  document.getElementById('detail').style.display='none';
  sv();
}

// close modal on overlay click
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});
document.getElementById('modal-grp').addEventListener('click',function(e){if(e.target===this)this.classList.remove('open');});

render();
</script>
</body>
</html>
