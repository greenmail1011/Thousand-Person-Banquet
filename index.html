<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>千人宴｜教定區調查</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#c9a84c;--gold-light:#f5edd6;
  --red:#8b1a1a;--red-light:#f9eeee;
  --green:#1a5c3a;--green-light:#eaf6f0;
  --blue:#1a3a6b;--blue-light:#eaf0fb;
  --ink:#1a1410;--paper:#fdfaf5;--paper2:#f5ede0;
  --border:#ddd0bb;
}
body{font-family:'Noto Sans TC',system-ui,sans-serif;font-size:13px;color:var(--ink);background:var(--paper);min-height:100vh}
.app{max-width:1100px;margin:0 auto;padding:16px}

/* loading */
#loading{position:fixed;inset:0;background:var(--paper);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#loading .spin{width:36px;height:36px;border:4px solid var(--border);border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading p{font-size:13px;color:#888;letter-spacing:2px}
#app-content{display:none}

/* header */
.header{text-align:center;padding:18px 0 14px;border-bottom:2px solid var(--gold);margin-bottom:18px}
.header h1{font-size:22px;font-weight:700;color:var(--red);letter-spacing:4px}
.header p{font-size:12px;color:#999;margin-top:4px;letter-spacing:2px}

/* sync indicator */
#sync-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#bbb;margin-left:8px;vertical-align:middle;transition:background .3s}
#sync-dot.ok{background:#2a7a4a}
#sync-dot.saving{background:var(--gold)}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.tab{padding:14px 8px;font-size:15px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:var(--paper2);color:#999;border-radius:10px;font-family:inherit;letter-spacing:1px;transition:all .15s}
.tab.on{background:var(--red);color:#fff;border-color:var(--red)}

.sec{display:none}.sec.on{display:block}

/* summary */
.sbar{display:flex;align-items:flex-start;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.sbar-main{display:flex;align-items:flex-start;gap:6px;flex:1;min-width:0;flex-wrap:wrap}
.sbar-main .sc{flex:1;min-width:80px}
.sbar-op{font-size:22px;font-weight:300;color:#bbb;align-self:flex-start;padding-top:10px;flex-shrink:0}
.sbar-sep{width:1px;background:var(--border);align-self:stretch;margin:0 4px;flex-shrink:0}
.sc{background:var(--paper2);border-radius:8px;padding:10px 12px}
.sc .n{font-size:32px;font-weight:700;line-height:1.1}
.sc .l{font-size:11px;color:#888;margin-top:2px}
.sc.red{background:var(--red-light)}.sc.red .n{color:var(--red)}
.sc.grn{background:var(--green-light)}.sc.grn .n{color:var(--green)}
.sc.blu{background:var(--blue-light)}.sc.blu .n{color:var(--blue)}

/* legend */
.legend{display:flex;gap:14px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.leg{display:flex;align-items:center;gap:5px;font-size:12px;color:#666}
.dot{width:13px;height:13px;border-radius:50%;flex-shrink:0}
.dot.attend{background:#1a5c3a}.dot.donate{background:#1a3a6b}
.dot.empty{background:#f9eeee;border:1.5px dashed #8b1a1a}

/* group chips */
.gsel{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.gchip{padding:5px 13px;border-radius:20px;border:1px solid var(--border);background:var(--paper2);font-size:12px;cursor:pointer;color:#666;font-family:inherit}
.gchip.on{background:var(--red-light);border-color:var(--red);color:var(--red);font-weight:500}

/* table grid */
.tgrid{display:flex;flex-direction:column;gap:20px}
.grp-section{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden}
.grp-section-head{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--paper2);border-bottom:1px solid var(--border)}
.grp-section-head .gname{font-size:13px;font-weight:700;color:var(--ink)}
.grp-section-head .gowner{font-size:11px;color:#888}
.grp-section-head .gbadge{margin-left:auto;font-size:11px;color:#888;background:var(--border);border-radius:12px;padding:2px 9px}
.grp-section-body{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;padding:14px}

/* round table card */
.rt-card{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color .15s}
.rt-card:hover{border-color:var(--gold)}
.rt-card.sel{border:2px solid var(--gold)}
.rt-top{padding:10px 12px 6px}
.rt-title{font-size:15px;font-weight:700;text-align:center;margin-bottom:3px}
.rt-sub{font-size:11px;text-align:center;color:#888;margin-bottom:6px}
.rt-stats{display:flex;justify-content:center;gap:10px;font-size:11px;margin-top:4px;padding-bottom:8px}

/* donate strip (legacy, kept for backward compat) */
.donate-strip{border-top:1px solid var(--border);background:var(--blue-light);padding:7px 10px}
.ds-title{font-size:10px;color:var(--blue);margin-bottom:5px;font-weight:600}
.dpills{display:flex;flex-wrap:wrap;gap:4px}
.dpill{font-size:11px;background:#fff;border:1px solid #a0b4d6;color:var(--blue);border-radius:20px;padding:2px 9px;cursor:pointer;transition:background .1s}
.dpill:hover{background:#dce8f8}

/* dedicated donate panel (pulled out, separate from tables) */
.dpanel{background:#fff;border:1px solid #a0b4d6;border-radius:12px;margin-top:18px;overflow:hidden}
.dpanel-head{background:var(--blue-light);padding:10px 14px;border-bottom:1px solid #c4d0e6;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}
.dpanel-head h3{font-size:14px;font-weight:600;color:var(--blue)}
.dpanel-head .subt{font-size:11px;color:#666;margin-top:2px}
.dpanel-head .total{font-size:12px;color:var(--blue);background:#fff;border:1px solid #a0b4d6;border-radius:14px;padding:2px 10px;font-weight:500}
.dpanel-body{padding:6px 14px}
.dgrp{padding:9px 0;border-bottom:1px dashed #d8e0ee}
.dgrp:last-child{border-bottom:none}
.dgrp-title{font-size:12px;font-weight:600;color:var(--ink);margin-bottom:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dgrp-title .owner{font-size:11px;color:#888;font-weight:400}
.dgrp-title .count{font-size:11px;color:var(--blue);background:var(--blue-light);border-radius:12px;padding:1px 8px;font-weight:500}
.dgrp-pills{display:flex;flex-wrap:wrap;gap:4px}

/* detail panel */
.detail{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;margin-top:14px}
.detail h3{font-size:14px;font-weight:600;margin-bottom:10px}
.slist{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px}
.si{display:flex;align-items:center;gap:7px;padding:6px 9px;border-radius:7px;border:1px solid var(--border);font-size:12px;cursor:pointer;background:var(--paper2);transition:border-color .1s}
.si:hover{border-color:var(--gold)}
.sdot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.sdot.attend{background:#1a5c3a}.sdot.donate{background:#1a3a6b}
.sdot.empty{background:#f9eeee;border:1.5px dashed #8b1a1a}
.sname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sstatus{font-size:10px;color:#999}
.donate-section{margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.donate-section h4{font-size:12px;font-weight:600;color:var(--blue);margin-bottom:6px}

/* buttons */
.btn{border:1px solid #ccc;background:var(--paper2);color:var(--ink);padding:5px 11px;border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit;transition:background .1s}
.btn:hover{background:var(--gold-light);border-color:var(--gold)}
.btn.pri{background:var(--red);color:#fff;border-color:var(--red)}.btn.pri:hover{background:#6d1515}
.btn.sm{padding:3px 8px;font-size:11px}
.btn.blu{color:var(--blue);border-color:#a0b4d6}.btn.blu:hover{background:var(--blue-light)}
.btn.danger{color:var(--red);border-color:#e0b0b0}.btn.danger:hover{background:var(--red-light)}

/* form */
.fg{display:flex;flex-direction:column;gap:3px;margin-bottom:10px}
.fg label{font-size:11px;color:#888}
.fg input,.fg select{border:1px solid #ccc;background:#fff;padding:7px 10px;border-radius:6px;font-size:13px;font-family:inherit;color:var(--ink);outline:none;width:100%}
.fg input:focus,.fg select:focus{border-color:var(--gold)}
.fg input[type=date]{width:200px}

/* modal */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;align-items:center;justify-content:center}
.overlay.open{display:flex}
.modal{background:#fff;border:1px solid var(--border);border-radius:14px;padding:20px;width:320px;max-width:92vw;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.modal h3{font-size:15px;font-weight:600;margin-bottom:14px;color:var(--red)}
.mbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}

/* transport */
.tr-section{background:#fff;border:1px solid var(--border);border-radius:12px;margin-bottom:14px;overflow:hidden}
.tr-head{padding:10px 16px;background:var(--paper2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.tr-head h3{font-size:14px;font-weight:600}
.tr-head .badge{font-size:12px;border-radius:12px;padding:2px 10px;font-weight:500}
.tr-grid{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px}
.tr-pill{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;border:1px solid var(--border);font-size:12px;background:var(--paper2);cursor:pointer;transition:background .1s}
.tr-pill:hover{background:var(--gold-light);border-color:var(--gold)}
.tr-pill .tr-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.tr-pill .tr-grp{font-size:10px;color:#aaa;margin-left:2px}

/* cfg */
.cfg-wrap{max-width:420px}
.cfg-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}

@media(max-width:480px){
  .sbar{flex-direction:column}
  .sbar-sep{display:none}
  .tgrid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- 載入中 -->
<div id="loading">
  <div class="spin"></div>
  <p>連線資料庫中…</p>
</div>

<div id="app-content">
<div class="app">
  <div class="header">
    <h1>千人宴｜教定區調查<span id="sync-dot" title="同步狀態"></span></h1>
    <p>席位管理系統</p>
  </div>

  <div class="tabs">
    <button class="tab on" onclick="sw('vis')">圓桌視圖</button>
    <button class="tab" onclick="sw('amt')">金額</button>
    <button class="tab" onclick="sw('tr')">交通</button>
  </div>

  <!-- 圓桌視圖 -->
  <div class="sec on" id="s-vis">
    <div class="sbar" id="sbar"></div>
    <div class="gsel" id="gsel"></div>
    <div class="tgrid" id="tgrid"></div>
    <div class="detail" id="detail" style="display:none"></div>
  </div>

  <!-- 金額 -->
  <div class="sec" id="s-amt">
    <div id="dpanel"></div>
  </div>

  <!-- 交通 -->
  <div class="sec" id="s-tr">
    <div id="tr-content"></div>
  </div>

  <!-- 設定 -->
  <div class="sec" id="s-cfg">
    <div class="cfg-wrap">
      <div class="fg"><label>活動名稱</label><input id="cfg-name"></div>
      <div class="fg"><label>活動日期</label><input id="cfg-date" type="date"></div>
      <div class="fg"><label>備註說明</label><input id="cfg-note"></div>
      <div class="cfg-actions">
        <button class="btn pri" onclick="saveCfg()">儲存設定</button>
        <button class="btn danger" onclick="resetAll()">清除全部資料</button>
      </div>
    </div>
  </div>
</div>
</div>

<!-- 座位編輯 modal -->
<div class="overlay" id="modal">
  <div class="modal">
    <h3 id="m-title">編輯座位</h3>
    <div class="fg"><label>姓名</label><input id="m-name" placeholder="空白表示空位"></div>
    <div class="fg"><label>狀態</label>
      <select id="m-status">
        <option value="attend">人到 +1500</option>
        <option value="donate">佈施 +1500（不佔位）</option>
        <option value="empty">空位（待補）</option>
      </select>
    </div>
    <div class="fg"><label>備註</label><input id="m-note" placeholder="選填"></div>
    <div class="mbtns">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn pri" onclick="saveModal()">儲存</button>
    </div>
  </div>
</div>

<!-- 新增分組 modal -->
<div class="overlay" id="modal-grp">
  <div class="modal">
    <h3>新增分組</h3>
    <div class="fg"><label>分組名稱</label><input id="mg-name" placeholder="例：茶道"></div>
    <div class="fg"><label>負責壇主</label><input id="mg-owner" placeholder="壇主姓名"></div>
    <div class="fg"><label>桌數</label><input id="mg-tables" type="number" min="1" max="20" value="1" style="width:80px"></div>
    <div class="mbtns">
      <button class="btn" onclick="document.getElementById('modal-grp').classList.remove('open')">取消</button>
      <button class="btn pri" onclick="saveGroupModal()">建立</button>
    </div>
  </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
// ── Firebase 初始化 ──────────────────────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyBfh90apkGPQOaBVBMU5VQaWepX9h3S308",
  authDomain: "thousand-person-banquet.firebaseapp.com",
  databaseURL: "https://thousand-person-banquet-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "thousand-person-banquet",
  storageBucket: "thousand-person-banquet.firebasestorage.app",
  messagingSenderId: "576462226098",
  appId: "1:576462226098:web:1b6839d92808a978ac3fab"
};
firebase.initializeApp(firebaseConfig);
const dbRef = firebase.database().ref('banquet');

// ── 狀態 ────────────────────────────────────────────────────
let D = null, selGroup=null, selSeat=null, lastTid=null;
let fbInitialized = false;
let syncTimeout = null;

function setSyncDot(state){
  const el=document.getElementById('sync-dot');
  if(!el)return;
  el.className='';
  if(state==='ok'){el.classList.add('ok');}
  else if(state==='saving'){el.classList.add('saving');}
}

// ── 預設資料 ────────────────────────────────────────────────
function def(){
  return {
    cfg:{name:'千人宴｜教定區',date:'',note:'呼籲各壇主廣邀道親前賢補位'},
    groups:[
      {id:'g1',name:'教定區',owner:'',tables:[
        {id:'t1',label:'第一桌',seats:[
          {id:'a1',name:'謝蜂香',status:'attend',note:''},
          {id:'a2',name:'謝蜂香',status:'attend',note:''},
          {id:'a3',name:'謝蜂香',status:'attend',note:''},
          {id:'a4',name:'謝蜂香',status:'attend',note:''},
          {id:'a5',name:'謝蜂香',status:'attend',note:''},
          {id:'a6',name:'謝蜂香',status:'attend',note:''},
          {id:'a7',name:'謝蜂香',status:'attend',note:''},
          {id:'a8',name:'謝蜂香',status:'attend',note:''},
          {id:'a9',name:'謝蜂香',status:'attend',note:''},
          {id:'a10',name:'謝蜂香',status:'attend',note:''},
        ]},
        {id:'t2',label:'第二桌',seats:[
          {id:'b1',name:'范植勇',status:'attend',note:''},
          {id:'b2',name:'劉治中',status:'attend',note:''},
          {id:'b3',name:'歐燕慧',status:'attend',note:''},
          {id:'b4',name:'曾安誠',status:'attend',note:''},
          {id:'b5',name:'姜詠崴',status:'attend',note:'',transport:'self'},
          {id:'b6',name:'張德光',status:'attend',note:'',transport:'self'},
          {id:'b7',name:'李冠德',status:'attend',note:''},
          {id:'b8',name:'周義順',status:'attend',note:'',transport:'self'},
          {id:'b9',name:'',status:'empty',note:''},
          {id:'b10',name:'',status:'empty',note:''},
          {id:'b11',name:'彭永才',status:'donate',note:'佈施但無法出席'},
          {id:'b12',name:'曾玉錦',status:'donate',note:'佈施但無法出席'},
        ]},
      ]},
      {id:'g3',name:'素環',owner:'素環壇主',tables:[
        {id:'t6',label:'第三桌',seats:Array.from({length:8},(_,i)=>({id:'sv'+(i+1),name:'',status:'empty',note:''}))},
      ]},
      {id:'g2',name:'茶道',owner:'錦秀壇主',tables:[
        {id:'t3',label:'第一桌',seats:Array.from({length:10},(_,i)=>({id:'c'+(i+1),name:'茶',status:'attend',note:''}))},
        {id:'t4',label:'第二桌',seats:[
          {id:'d1',name:'茶',status:'attend',note:''},
          {id:'d2',name:'陳志杰',status:'attend',note:'',tag:'教定區'},
          {id:'d3',name:'周晴宣',status:'attend',note:'',tag:'教定區'},
          {id:'d4',name:'李玉英',status:'attend',note:'',tag:'教定區'},
          {id:'d5',name:'陳羽芯',status:'attend',note:'',tag:'教定區'},
          {id:'d6',name:'陳塏侖',status:'attend',note:'',tag:'教定區'},
          ...Array.from({length:4},(_,i)=>({id:'d'+(i+7),name:'',status:'empty',note:''})),
        ]},
      ]},
    ]
  };
}

// ── 遷移舊資料 ───────────────────────────────────────────────
function migrate(d){
  if(!d||!d.groups)return def();
  // 遷移：移除教定區壇主名稱
  const g1=d.groups.find(g=>g.id==='g1');
  if(g1&&g1.owner==='謝壇主')g1.owner='';
  // 遷移：教定區道親→謝壇主，茶道道親→茶菩薩
  const g2r=d.groups.find(g=>g.id==='g2');
  if(g1)g1.tables.forEach(t=>t.seats.forEach(s=>{if(s.name==='道親')s.name='謝壇主';}));
  if(g2r)g2r.tables.forEach(t=>t.seats.forEach(s=>{if(s.name==='道親'||s.name==='茶菩薩')s.name='茶';}));
  // 遷移：第一桌蜂香/謝壇主→謝蜂香
  if(g1){const t1=g1.tables.find(t=>t.id==='t1');if(t1)t1.seats.forEach(s=>{if(s.name==='蜂香'||s.name==='謝壇主'||s.name==='道親')s.name='謝蜂香';});}
  // 遷移：加入周義順
  if(g1){const t2=g1.tables.find(t=>t.id==='t2');if(t2){const b8=t2.seats.find(s=>s.id==='b8');if(b8&&(b8.status==='empty'||!b8.name)){b8.name='周義順';b8.status='attend';b8.transport='self';}}}
  // 遷移：若無素環壇主分組則自動補入
  if(!d.groups.find(g=>g.id==='g3')){
    d.groups.splice(1,0,{id:'g3',name:'素環',owner:'素環壇主',tables:[
      {id:'t6',label:'第三桌',seats:Array.from({length:8},(_,i)=>({id:'sv'+(i+1),name:'',status:'empty',note:''}))}
    ]});
  }
  // 遷移：刪除素環的佈施名單桌
  const g3=d.groups.find(g=>g.id==='g3');
  if(g3)g3.tables=g3.tables.filter(t=>t.id!=='t5');
  // 遷移：若素環已存在但缺第三桌則補入
  if(g3&&!g3.tables.find(t=>t.id==='t6')){
    g3.tables.push({id:'t6',label:'第三桌',seats:Array.from({length:8},(_,i)=>({id:'sv'+(i+1),name:'',status:'empty',note:''}))});
  }
  // 遷移：第三桌若超過8位則裁切至8位
  const t6=g3&&g3.tables.find(t=>t.id==='t6');
  if(t6&&t6.seats.length>8){t6.seats=t6.seats.slice(0,8);}
  // 遷移：5位一家人全移至茶道，教定區3位還原空位
  const g1m=d.groups.find(g=>g.id==='g1');
  const g2m=d.groups.find(g=>g.id==='g2');
  const family=['陳志杰','周晴宣','李玉英','陳羽芯','陳塏侖'];
  if(g1m)g1m.tables.forEach(t=>t.seats.forEach(s=>{if(family.includes(s.name)){s.name='';s.status='empty';}}));
  if(g2m){
    const t4=g2m.tables.find(t=>t.id==='t4');
    if(t4){
      const existing=t4.seats.filter(s=>s.tag==='教定區').map(s=>s.name);
      const toAdd=family.filter(n=>!existing.includes(n));
      let fi=0;
      t4.seats.forEach(s=>{if(s.status==='empty'&&fi<toAdd.length){s.name=toAdd[fi];s.status='attend';s.tag='教定區';fi++;}});
    }
  }
  return d;
}

// ── Firebase 讀寫 ────────────────────────────────────────────
function sv(){
  setSyncDot('saving');
  if(syncTimeout)clearTimeout(syncTimeout);
  dbRef.set(D).then(()=>{
    setSyncDot('ok');
  }).catch(e=>console.error('Firebase write error:',e));
  // 立即本地渲染，不等 Firebase 回應
  renderAll();
}

// 連線逾時保護：8秒內沒回應則顯示錯誤提示
const connTimeout=setTimeout(()=>{
  if(!fbInitialized){
    document.querySelector('#loading p').textContent='⚠️ 無法連線資料庫，請確認 Firebase 規則已設為開放讀寫';
    document.querySelector('#loading p').style.color='#c44';
  }
},8000);

// Firebase 即時監聽（所有客戶端同步）
dbRef.on('value', snapshot=>{
  clearTimeout(connTimeout);
  const val=snapshot.val();
  if(!fbInitialized){
    // 首次載入
    fbInitialized=true;
    if(val){
      D=migrate(val);
      // 若遷移後資料有變化則寫回
      if(JSON.stringify(D)!==JSON.stringify(val))dbRef.set(D);
    } else {
      // Firebase 無資料，嘗試從 localStorage 遷移
      try{
        const ls=localStorage.getItem('qianren_rt_v7');
        D=ls?migrate(JSON.parse(ls)):def();
      }catch(e){D=def();}
      dbRef.set(D);
    }
    document.getElementById('loading').style.display='none';
    document.getElementById('app-content').style.display='block';
    renderAll();
    setSyncDot('ok');
  } else {
    // 其他客戶端的即時更新
    if(val){
      D=val;
      renderAll();
      setSyncDot('ok');
    }
  }
});

// ── 輔助函式 ─────────────────────────────────────────────────
function uid(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function allSeats(){return D.groups.flatMap(g=>g.tables.flatMap(t=>t.seats));}
function stats(seats){return{
  attend:seats.filter(s=>s.status==='attend').length,
  donate:seats.filter(s=>s.status==='donate').length,
  empty:seats.filter(s=>s.status==='empty').length
};}

function sw(t){
  document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('on',['vis','amt','tr','cfg'][i]===t));
  ['s-vis','s-amt','s-tr','s-cfg'].forEach(id=>document.getElementById(id).classList.toggle('on',id==='s-'+t));
  if(t==='tr')renderTransport();
  if(t==='amt')renderDonatePanel();
}

function renderAll(){
  if(!D)return;
  render();
  if(document.getElementById('s-tr').classList.contains('on'))renderTransport();
  if(document.getElementById('s-amt').classList.contains('on'))renderDonatePanel();
}

function render(){if(!D)return;renderSbar();renderGsel();renderTgrid();renderCfg();}

function renderSbar(){
  const s=stats(allSeats());
  const attendG1=D.groups.flatMap(g=>g.tables.flatMap(t=>t.seats)).filter(s=>s.status==='attend').length;
  const attendLines=D.groups.map(g=>{
    // 茶道只計算自己的位（排除 tag:'教定區' 的借座）
    const base=g.tables.flatMap(t=>t.seats).filter(s=>s.status==='attend'&&!s.tag).length;
    return base>0?`<div style="font-size:10px;color:#2a7a4a;margin-top:2px">${g.name} ${base} 位</div>`:'';
  }).filter(Boolean).join('')
  +(D.groups.filter(g=>g.id!=='g1').flatMap(g=>g.tables.flatMap(t=>t.seats)).filter(s=>s.status==='attend'&&s.tag==='教定區').length>0
    ?`<div style="font-size:10px;color:#2a7a4a;margin-top:2px">教定借茶道座 ${D.groups.filter(g=>g.id!=='g1').flatMap(g=>g.tables.flatMap(t=>t.seats)).filter(s=>s.status==='attend'&&s.tag==='教定區').length} 位</div>`
    :'');
  const emptyLines=D.groups.map(g=>{
    const e=g.tables.flatMap(t=>t.seats).filter(s=>s.status==='empty').length;
    return e>0?`<div style="font-size:10px;color:#b04040;margin-top:2px">${g.name} ${e} 位</div>`:'';
  }).filter(Boolean).join('');
  const seatLines=D.groups.map(g=>{
    const seats=g.tables.flatMap(t=>t.seats).filter(s=>s.status!=='donate');
    return seats.length>0?`<div style="font-size:10px;color:#666;margin-top:2px">${g.name} ${seats.length} 位</div>`:'';
  }).filter(Boolean).join('');
  document.getElementById('sbar').innerHTML=`
    <div class="sbar-main">
      <div class="sc grn"><div class="n">${attendG1}</div><div class="l">佈施（出席）</div>${attendLines}</div>
      <div class="sbar-op">＋</div>
      <div class="sc red"><div class="n">${s.empty}</div><div class="l">空位待補</div>${emptyLines}</div>
      <div class="sbar-op">＝</div>
      <div class="sc"><div class="n">${s.attend+s.empty}</div><div class="l">實際席位數</div>${seatLines}</div>
    </div>
    <div class="sbar-sep"></div>
    <div class="sc blu" style="min-width:90px"><div class="n">${s.donate}</div><div class="l">佈施（不出席）</div></div>`;

function selGrp(id){selGroup=id;selSeat=null;lastTid=null;document.getElementById('detail').style.display='none';render();}

function renderTgrid(){
  const groups=selGroup?D.groups.filter(g=>g.id===selGroup):D.groups;
  document.getElementById('tgrid').innerHTML=groups.map(g=>{
    const tables=g.tables.map(t=>({...t,gname:g.name,owner:g.owner,gid:g.id}));
    const visibleTables=tables.filter(t=>t.seats.some(s=>s.status!=='donate'));
    if(!visibleTables.length)return'';
    const gStats=stats(g.tables.flatMap(t=>t.seats));
    const cards=visibleTables.map(t=>{
    const seatSeats=t.seats.filter(s=>s.status!=='donate');
    const s=stats(t.seats);
    const n=seatSeats.length;
    const sz=340,cx=sz/2,cy=sz/2,tr=106,sr=30;
    const seatsSvg=seatSeats.map((seat,i)=>{
      const a=(2*Math.PI/Math.max(n,1))*i-Math.PI/2;
      const x=(cx+tr*Math.cos(a)).toFixed(1);
      const y=(cy+tr*Math.sin(a)).toFixed(1);
      const yt=(parseFloat(y)+4).toFixed(1);
      const isJD=t.gid==='g1'||(seat.tag==='教定區');
      const isTea=t.gid==='g2'&&!seat.tag;
      const col=seat.status==='empty'?'#f9eeee':isJD?'#8b1a1a':isTea?'#5b2d8e':'#1a5c3a';
      const stk=seat.status==='empty'?'#8b1a1a':isJD?'#6d1515':isTea?'#3d1a6e':col;
      const dash=seat.status==='empty'?'stroke-dasharray="3 2"':'';
      const rawNm=seat.name||'';
      const nm=seat.status==='empty'?'空':(rawNm==='謝蜂香'?'謝':(rawNm.length>=3?rawNm.slice(-2):rawNm)||'');
      const nmFs=nm.length===1?16:13;
      const tc=seat.status==='attend'?'#fff':'#8b1a1a';
      return `<circle cx="${x}" cy="${y}" r="${sr}" fill="${col}" stroke="${stk}" stroke-width="2" ${dash} style="cursor:pointer" onclick="openSeat('${t.id}','${seat.id}')"/>
<text x="${x}" y="${yt}" text-anchor="middle" font-size="${nmFs}" font-weight="600" fill="${tc}" font-family="sans-serif" style="pointer-events:none;user-select:none">${nm}</text>`;
    }).join('');
    const isSel=selSeat&&selSeat.tid===t.id;
    const cLabel=s.empty>0?s.empty+'空位':'滿座';
    return `<div class="rt-card${isSel?' sel':''}" onclick="selectTable('${t.id}')">
  <div class="rt-top">
    <div class="rt-title">${t.label}</div>
    <svg width="100%" viewBox="0 0 ${sz} ${sz}" style="display:block;margin:0 auto;max-width:${sz}px">
      <circle cx="${cx}" cy="${cy}" r="50" fill="#fdf8f0" stroke="#d4b896" stroke-width="2"/>
      <text x="${cx}" y="${cy-5}" text-anchor="middle" font-size="18" fill="#8a6d28" font-family="sans-serif" font-weight="700">${s.attend}/${n}</text>
      <text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="13" fill="#c9a84c" font-family="sans-serif">${cLabel}</text>
      ${seatsSvg}
    </svg>
    <div class="rt-stats">
      <span style="color:#1a5c3a">到 ${s.attend}</span>
      ${s.empty?`<span style="color:#8b1a1a;font-weight:600">空 ${s.empty}</span>`:''}
    </div>
  </div>
</div>`;
    }).join('');
    return `<div class="grp-section">
  <div class="grp-section-head">
    <span class="gname">${g.name}</span>
    ${g.owner?`<span class="gowner">${g.owner}</span>`:''}
    <span class="gbadge"><span style="color:#8b1a1a;font-weight:600">出席 ${gStats.attend}</span> · <span style="color:#1a5c3a;font-weight:600">空位 ${gStats.empty}</span></span>
  </div>
  <div class="grp-section-body">${cards}</div>
</div>`;
  }).join('');
}

    const items=g.tables.flatMap(t=>t.seats.filter(s=>s.status==='donate').map(s=>({...s,tid:t.id,tlabel:t.label})));
    return {gid:g.id,gname:g.name,owner:g.owner,items};

      <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px">
        <span style="font-size:13px;font-weight:600;color:var(--red)">教定區總計金額</span>
        <span style="font-size:20px;font-weight:700;color:var(--red)">NT$ ${fmt(grandTotal)}</span>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${attendTotal>0?`<div style="flex:1;min-width:120px;background:#fff;border:1px solid #d4b896;border-radius:8px;overflow:hidden">
          <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;cursor:pointer;user-select:none" onclick="togglePanel('dp-attend')">
            <div>
              <div style="font-size:11px;color:#888;margin-bottom:2px">會出席</div>
              <div style="font-size:14px;font-weight:700;color:var(--green)">${attendTotal} 位</div>
              <div style="font-size:11px;color:#666;margin-top:1px">NT$ ${fmt(attendTotal*UNIT)}</div>
            </div>
            <span id="dp-attend-arrow" style="font-size:11px;color:#aaa">▼ 收合</span>
          </div>
          <div id="dp-attend" style="display:block;border-top:1px solid #eedfc0"><div class="dpanel-body">${attendData.map(g=>renderGroup(g)).join('')}</div></div>

        <div style="display:flex;align-items:center;font-size:16px;color:#bbb">＋</div>

  const tbl=allT.find(t=>t.id===tid);

  selSeat={tid};

  const el=document.getElementById('detail');
  el.style.display='block';
  const seatSeats=tbl.seats.filter(s=>s.status!=='donate');

  el.innerHTML=`<h3>${tbl.label} <span style="font-size:12px;color:#888;font-weight:400">· ${tbl.gname} · ${tbl.owner}</span></h3>
<div class="slist">
${seatSeats.map((s,i)=>`<div class="si" onclick="openSeat('${tid}','${s.id}')">
  <div class="sdot ${s.status}"></div>

  const tbl=D.groups.flatMap(g=>g.tables).find(t=>t.id===tid);

  selSeat={tid,sid};
  document.getElementById('m-title').textContent='編輯';

  document.getElementById('m-note').value=seat.note||'';

  selSeat={tid,sid:null};
  document.getElementById('m-title').textContent='新增';

  document.getElementById('m-status').value=def||'empty';
  document.getElementById('m-note').value='';

function closeModal(){document.getElementById('modal').classList.remove('open');}
function saveModal(){
  const name=document.getElementById('m-name').value.trim();
  const status=document.getElementById('m-status').value;
  const note=document.getElementById('m-note').value.trim();
  const tbl=D.groups.flatMap(g=>g.tables).find(t=>t.id===selSeat.tid);
  if(selSeat.sid){
    const s=tbl.seats.find(s=>s.id===selSeat.sid);
    s.name=name;s.status=status;s.note=note;
  } else {
    tbl.seats.push({id:uid(),name,status,note});
  }
  closeModal();sv();
  if(lastTid)selectTable(lastTid,true);
}
function deleteTable(gid,tid){
  if(!confirm('確定刪除此桌？'))return;
  D.groups.find(g=>g.id===gid).tables=D.groups.find(g=>g.id===gid).tables.filter(t=>t.id!==tid);
  lastTid=null;document.getElementById('detail').style.display='none';selSeat=null;sv();
}

function renderTransport(){
  if(!D)return;
  // 設定未有 transport 欄位的人預設為 undecided
  D.groups.forEach(g=>g.tables.forEach(t=>t.seats.forEach(s=>{
    if(s.status==='attend'&&s.name&&!s.transport)s.transport='undecided';
  })));
  // 設定張德光、姜詠崴等為 self（若還未設定）
  const selfNames=['張德光','姜詠崴','陳志杰','周晴宣','李玉英','陳羽芯','陳塏侖','周義順'];
  D.groups.forEach(g=>g.tables.forEach(t=>t.seats.forEach(s=>{
    if(selfNames.includes(s.name)&&s.status==='attend'&&!s.transport)s.transport='self';
  })));

  const attending=D.groups.flatMap(g=>g.tables.flatMap(t=>t.seats
    .filter(s=>s.status==='attend'&&s.name&&(g.id!=='g2'||s.tag==='教定區'))
    .map(s=>({...s,gname:g.name,gid:g.id,tid:t.id}))));

  const busArr=attending.filter(s=>s.transport==='bus');
  const selfArr=attending.filter(s=>s.transport==='self');
  const undecidedArr=attending.filter(s=>s.transport==='undecided'||!s.transport);

  const dispGid=s=>s.tag==='教定區'?'g1':s.gid;
  const dispGname=s=>s.tag==='教定區'?'教定區':s.gname;
  const grpColor=gid=>gid==='g1'?'#8b5200':'#1a5c3a';

  const pillHtml=(s)=>`<div class="tr-pill" onclick="toggleTransport('${s.tid}','${s.id}')">
    <div class="tr-dot" style="background:${grpColor(dispGid(s))}"></div>
    <span>${s.name}</span>
    <span class="tr-grp">${dispGname(s)}</span>
  </div>`;

  document.getElementById('tr-content').innerHTML=`
    <div class="tr-section">
      <div class="tr-head">
        <h3>🚌 遊覽車</h3>
        <span class="badge" style="background:var(--green-light);color:var(--green)">${busArr.length} 位</span>
      </div>
      <div class="tr-grid">${busArr.map(pillHtml).join('')||'<span style="color:#aaa;font-size:12px">尚無人員</span>'}</div>
    </div>
    <div class="tr-section">
      <div class="tr-head">
        <h3>🚗 自行前往</h3>
        <span class="badge" style="background:var(--red-light);color:var(--red)">${selfArr.length} 位</span>
      </div>
      <div class="tr-grid">${selfArr.map(pillHtml).join('')||'<span style="color:#aaa;font-size:12px">尚無人員</span>'}</div>
    </div>
    <div class="tr-section">
      <div class="tr-head">
        <h3>❓ 尚未決定</h3>
        <span class="badge" style="background:#f5f0ff;color:#7c3aed">${undecidedArr.length} 位</span>
      </div>
      <div class="tr-grid">${undecidedArr.map(pillHtml).join('')||'<span style="color:#aaa;font-size:12px">尚無人員</span>'}</div>
    </div>
    <div style="font-size:11px;color:#aaa;text-align:center;margin-top:8px">點擊姓名可切換：遊覽車 → 自行前往 → 尚未決定</div>
  `;
}

function toggleTransport(tid,sid){
  const tbl=D.groups.flatMap(g=>g.tables).find(t=>t.id===tid);
  const seat=tbl&&tbl.seats.find(s=>s.id===sid);
  if(!seat)return;
  const cycle={bus:'self',self:'undecided',undecided:'bus'};
  seat.transport=cycle[seat.transport]||'bus';
  sv();renderTransport();
}

function openAddGroup(){
  document.getElementById('mg-name').value='';
  document.getElementById('mg-owner').value='';
  document.getElementById('mg-tables').value='1';
  document.getElementById('modal-grp').classList.add('open');
}
function saveGroupModal(){
  const name=document.getElementById('mg-name').value.trim();
  const owner=document.getElementById('mg-owner').value.trim();
  const nt=parseInt(document.getElementById('mg-tables').value)||1;
  if(!name)return alert('請輸入分組名稱');
  const labels=['一','二','三','四','五','六','七','八','九','十'];
  D.groups.push({id:uid(),name,owner,tables:Array.from({length:nt},(_,ti)=>({
    id:uid(),label:`第${labels[ti]||ti+1}桌`,
    seats:Array.from({length:10},()=>({id:uid(),name:'',status:'empty',note:''}))
  }))});
  document.getElementById('modal-grp').classList.remove('open');sv();
}
function addTableTo(gid){
  const g=D.groups.find(g=>g.id===gid);
  const labels=['一','二','三','四','五','六','七','八','九','十'];
  g.tables.push({id:uid(),label:`第${labels[g.tables.length]||g.tables.length+1}桌`,
    seats:Array.from({length:10},()=>({id:uid(),name:'',status:'empty',note:''}))});
  sv();
}
function deleteGroup(gid){
  if(!confirm('確定刪除此分組？'))return;
  D.groups=D.groups.filter(g=>g.id!==gid);
  if(selGroup===gid)selGroup=null;sv();
}

function renderCfg(){
  if(!D)return;
  document.getElementById('cfg-name').value=D.cfg.name||'';
  document.getElementById('cfg-date').value=D.cfg.date||'';
  document.getElementById('cfg-note').value=D.cfg.note||'';
}
function saveCfg(){
  D.cfg.name=document.getElementById('cfg-name').value;
  D.cfg.date=document.getElementById('cfg-date').value;
  D.cfg.note=document.getElementById('cfg-note').value;
  sv();alert('已儲存！');
}
function resetAll(){
  if(!confirm('確定清除全部資料？此動作無法復原。'))return;
  D=def();lastTid=null;
  document.getElementById('detail').style.display='none';
  sv();
}

function togglePanel(id){
  const el=document.getElementById(id);
  const arrow=document.getElementById(id+'-arrow');
  if(!el)return;
  const open=el.style.display==='none';
  el.style.display=open?'block':'none';
  if(arrow)arrow.textContent=open?'▼ 收合':'▶ 展開';
}

// close modal on overlay click
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});
document.getElementById('modal-grp').addEventListener('click',function(e){if(e.target===this)this.classList.remove('open');});
</script>
</body>
</html>
